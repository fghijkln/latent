<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Latent Playground</title>
<style>
:root{--bg:#0f1115;--panel:#171a21;--line:#262b36;--fg:#e6e8ee;--mute:#8a93a6;--acc:#7aa2ff;--err:#ff7a85;--ok:#7ee0a1}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{font-size:16px;margin:0}h1 span{color:var(--acc)}
select,button{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:6px 10px;font:inherit}
button.run{background:var(--acc);color:#0b1020;border:none;font-weight:600;cursor:pointer}button:disabled{opacity:.6}
.grow{flex:1}a{color:var(--mute);font-size:13px}
main{display:grid;grid-template-columns:1fr 1fr;height:calc(100vh - 58px)}
@media(max-width:800px){main{grid-template-columns:1fr;height:auto}textarea{height:45vh}.out{min-height:40vh}}
textarea{width:100%;height:100%;resize:none;background:var(--bg);color:var(--fg);border:0;border-right:1px solid var(--line);padding:14px;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;outline:none;tab-size:4}
.out{display:flex;flex-direction:column;overflow:hidden}
.tabs{display:flex;border-bottom:1px solid var(--line)}.tabs button{border:0;border-radius:0;background:none;color:var(--mute);padding:8px 14px}.tabs button.on{color:var(--fg);border-bottom:2px solid var(--acc)}
pre{margin:0;padding:14px;overflow:auto;flex:1;white-space:pre-wrap;word-break:break-word;font:13px/1.55 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.err{color:var(--err)}.meta{color:var(--mute);padding:6px 14px;font-size:12px;border-top:1px solid var(--line)}
</style>
</head>
<body>
<header>
  <h1>Latent <span>Playground</span></h1>
  <select id="ex"></select>
  <button class="run" id="run">▶ 运行 (Ctrl+Enter)</button>
  <span class="grow"></span>
  <a href="https://github.com/fghijkln/latent" target="_blank" rel="noopener">GitHub</a>
</header>
<main>
  <textarea id="src" spellcheck="false"></textarea>
  <div class="out">
    <div class="tabs"><button id="t-out" class="on">输出</button><button id="t-py">生成的 Python</button></div>
    <pre id="out">点“运行”试试。</pre>
    <div class="meta" id="meta">编译到 Python 后在沙箱里运行 · 已禁用 py/java 互操作与模块导入 · 限时 5 秒</div>
  </div>
</main>
<script>
const EX = {
"Hello": `say "Hello, Latent!"\n\nname = "world"\nsay "hi " + name\n`,
"斐波那契": `fn fib(n):\n    if n < 2:\n        return n\n    fib(n - 1) + fib(n - 2)\n\nsay fib(20)\n`,
"闭包": `fn counter():\n    n = 0\n    fn inc():\n        nonlocal n\n        n = n + 1\n        return n\n    return inc\n\nc = counter()\nc()\nc()\nsay c()\n`,
"类与继承": `class Animal:\n    fn init(self, name):\n        self.name = name\n\n    fn describe(self):\n        "animal:\${self.name}"\n\nclass Dog(Animal):\n    fn init(self, name, breed):\n        super.init(self, name)\n        self.breed = breed\n\n    fn describe(self):\n        super.describe(self) + " (\${self.breed})"\n\ndog = Dog.new("Milo", "shiba")\nsay dog.describe()\n`,
"列表": `xs = [3, 1, 4, 1, 5, 9, 2, 6]\ntotal = 0\nfor x in xs:\n    total = total + x\nsay total\nsay len(xs)\n`
};
const $ = id => document.getElementById(id);
for (const k in EX) { const o = document.createElement("option"); o.textContent = k; $("ex").appendChild(o); }
$("src").value = localStorage.getItem("lt-src") || EX["斐波那契"];
$("ex").onchange = () => { $("src").value = EX[$("ex").value]; };
let last = null, tab = "out";
function show() {
  $("t-out").className = tab === "out" ? "on" : ""; $("t-py").className = tab === "py" ? "on" : "";
  const o = $("out"); o.className = "";
  if (!last) return;
  if (tab === "py") {
    let code = last.python || "(没有生成代码)";
    if (last.python_truncated) code = "⚠ 生成代码已截断，仅显示返回上限内的前缀；此内容不完整。\n\n" + code;
    o.textContent = code;
    return;
  }
  if (last.error) { o.className = "err"; o.textContent = last.error; return; }
  let t = last.stdout || "";
  if (last.truncated) t += "\n⚠ 输出超限，程序已中止（不是成功完成）";
  if (last.stderr) t += (t ? "\n" : "") + last.stderr;
  if (last.timeout) t += "\n⏱ 超时或超出资源限制，已终止";
  if (last.exit !== undefined) t += `\n退出码：${last.exit}`;
  o.textContent = t || "(无输出)";
  if (!last.ok) o.className = "err";
}
$("t-out").onclick = () => { tab = "out"; show(); };
$("t-py").onclick = () => { tab = "py"; show(); };
async function run() {
  const src = $("src").value; localStorage.setItem("lt-src", src);
  $("run").disabled = true; $("out").className = ""; $("out").textContent = "运行中…";
  const t0 = performance.now();
  try {
    const r = await fetch("/api/run", {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify({source: src})});
    last = await r.json();
    const status = last.truncated ? "⚠ 输出超限，程序已中止" : (last.ok ? "✓ 成功" : "✗ " + (last.stage || "错误"));
    const exit = last.exit === undefined ? "" : ` · 退出码 ${last.exit}`;
    $("meta").textContent = status + exit + " · " + Math.round(performance.now() - t0) + " ms";
  } catch (e) {
    last = {ok: false, error: "请求失败：" + e + "\n（免费实例休眠后首次唤醒可能要几秒，再点一次）"};
    $("meta").textContent = "✗ 请求失败 · " + Math.round(performance.now() - t0) + " ms";
  }
  $("run").disabled = false; tab = "out"; show();
}
$("run").onclick = run;
$("src").addEventListener("keydown", e => {
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter") { e.preventDefault(); run(); }
  if (e.key === "Tab") { e.preventDefault(); const s = e.target, a = s.selectionStart; s.setRangeText("    ", a, s.selectionEnd, "end"); }
});
</script>
</body>
</html>
