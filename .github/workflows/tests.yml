name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }} / JDK ${{ matrix.java-version }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        java-version: [17, 21]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate supported Ubuntu CPython/UCD pair
        run: python tests/bootstrap/check_supported_runtime.py

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install test dependency
        run: python -m pip install "numpy>=1.26,<3"

      - name: Check Python syntax
        run: >-
          python -m compileall -q ast_dump.py desugar.py editor_metadata.py
          gen_c.py gen_java.py gen_py.py latent.py lex.py module_system.py nodes.py
          parse.py semant.py
          runtime/ltpy.py tests
          tools/latent_stage1.py

      - name: Test editor metadata contract
        run: python tests/test_editor_metadata.py

      - name: Compile shared Java runtime and interop fixture
        run: |
          set -eu
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          javac -d "$build_dir" runtime/JReflect.java runtime/LtRt.java \
            runtime/LtJavaDaemon.java tests/java/Stage1Overloads.java

      - name: Run complete regression suite
        run: python tests/run_tests.py

  bootstrap-smoke:
    name: P15 self-host bootstrap gates / Python ${{ matrix.python-version }} / JDK 17
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      enable_mcp: "false"
    steps:
      - name: Check out repository and fixed Stage0 history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate supported Ubuntu CPython/UCD pair
        run: python tests/bootstrap/check_supported_runtime.py

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Python-target test dependency
        run: python -m pip install "numpy>=1.26,<3"

      - name: Validate Python-target projection ledger
        run: |
          python tests/bootstrap/checker.py
          python tests/bootstrap/test_checker.py

      - name: Test bootstrap host contract
        run: python tests/test_bootstrap_host.py

      - name: Test opt-in Stage1 preview launcher and cache
        run: python -m unittest tests.test_latent_stage1 -v

      - name: Test Stage0/1 differential and Stage1-to-3 fixed point / dual-root reproducibility
        run: python -m unittest tests.test_bootstrap_smoke -v
        env:
          P15_BOOTSTRAP_MANIFEST_REPORT: ${{ runner.temp }}/p15-bootstrap-fixed-point.json

      - name: Test Latent lexer through fixed Stage0
        run: python -m unittest tests.test_bootstrap_lexer -v

      - name: Test Latent parser through fixed Stage0
        run: python -m unittest tests.test_bootstrap_parser -v

      - name: Project every included Python-target case from fixed Stage0 through Stage2
        run: >-
          python tests/bootstrap/project_stage0.py
          --report "$RUNNER_TEMP/p15-stage0-stage2-projection.json"

      - name: Upload normalized bootstrap validation reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: p15-validation-reports-${{ github.sha }}
          path: |
            ${{ runner.temp }}/p15-bootstrap-fixed-point.json
            ${{ runner.temp }}/p15-stage0-stage2-projection.json
          if-no-files-found: ignore
          retention-days: 14

  vscode-extension:
    name: VS Code extension
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"

      - name: Check VS Code keyword synchronization
        run: python3 tools/sync_vscode_keywords.py --check

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Install VS Code and virtual display
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends xvfb
          curl --fail --location --retry 3 \
            https://update.code.visualstudio.com/1.141.0/linux-deb-x64/stable \
            --output /tmp/vscode.deb
          sudo apt-get install --yes --no-install-recommends /tmp/vscode.deb

      - name: Install Python test dependency
        run: python -m pip install "numpy>=1.26,<3"

      - name: Install extension dependencies
        run: npm ci
        working-directory: vscode-latent

      - name: Test VS Code extension
        run: xvfb-run --auto-servernum npm test
        working-directory: vscode-latent
        env:
          VSCODE_EXECUTABLE: /usr/share/code/code

      - name: Package VS Code extension
        run: npm run package
        working-directory: vscode-latent

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vscode-extension-${{ github.sha }}
          path: vscode-latent/*.vsix
          if-no-files-found: error
          retention-days: 14
