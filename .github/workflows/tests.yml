name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Python 3.11 / JDK ${{ matrix.java-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java-version: [17, 21]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java-version }}

      - name: Install test dependency
        run: python -m pip install "numpy>=1.26,<3"

      - name: Check Python syntax
        run: >-
          python -m compileall -q ast_dump.py desugar.py gen_java.py gen_py.py
          latent.py lex.py module_system.py nodes.py parse.py semant.py
          runtime/ltpy.py tests

      - name: Compile shared Java runtime and interop fixture
        run: |
          set -eu
          build_dir="$(mktemp -d)"
          trap 'rm -rf "$build_dir"' EXIT
          javac -d "$build_dir" runtime/JReflect.java runtime/LtRt.java \
            runtime/LtJavaDaemon.java tests/java/Stage1Overloads.java

      - name: Run complete regression suite
        run: python tests/run_tests.py
